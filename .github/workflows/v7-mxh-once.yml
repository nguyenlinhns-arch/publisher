name: V7 MXH One Shot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v7-mxh-once.yml'

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Call V7 Fast Control health
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 \
            -o v7-health.txt \
            -w '%{http_code}' \
            'https://xamviatbxufjlpiwhebb.supabase.co/functions/v1/v7-mxh-once')
          echo "HTTP_STATUS=$code"
          cat v7-health.txt
          echo
