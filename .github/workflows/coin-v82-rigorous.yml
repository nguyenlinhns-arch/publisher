name: Coin V8.2 Rigorous Iterative Research

on:
  push:
    paths:
      - "coin-v8/v82_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-v82-rigorous
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow numpy requests numba scipy

      - name: Record V8.2 start
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p coin-v8/status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "state": "RUNNING",
              "version": "V8.2",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "trigger_sha": os.environ["HEAD_SHA"],
              "started_at_utc": datetime.now(timezone.utc).isoformat(),
              "mode": "RESEARCH_ONLY / NO_PAPER / NO_LIVE",
          }
          open("coin-v8/status/latest_v82.json", "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status/latest_v82.json
          git commit -m "Mark Coin V8.2 running [skip ci]" || true
          git push || true

      - name: Build rigorous V8.2 runner
        run: |
          rm -rf coin-v8/results_v82
          mkdir -p coin-v8/results_v82 coin-v8/status
          python coin-v8/v82_patch_runner.py

      - name: Execute V8.2 research and capture log
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          python coin-v8/iterative_research_v82.py 2>&1 | tee coin-v8/status/runtime_v82.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > coin-v8/status/exit_code_v82.txt
          exit 0

      - name: Record result and commit
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git pull --rebase || true
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          rc = int(open("coin-v8/status/exit_code_v82.txt").read().strip())
          payload = {
              "state": "COMPLETED" if rc == 0 else "FAILED",
              "version": "V8.2",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "trigger_sha": os.environ["HEAD_SHA"],
              "exit_code": rc,
              "finished_at_utc": datetime.now(timezone.utc).isoformat(),
              "methodology": [
                  "correct active-period metrics",
                  "calendar-day Sharpe and DSR",
                  "pre-holdout-only ensemble selection",
                  "bootstrap lower-bound strict gate",
                  "Deflated Sharpe probability >= 95% strict gate",
              ],
              "mode": "RESEARCH_ONLY / NO_PAPER / NO_LIVE",
          }
          open("coin-v8/status/latest_v82.json", "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/results_v82 coin-v8/status/latest_v82.json coin-v8/status/runtime_v82.log coin-v8/status/v82_runner_sha256.txt
          git commit -m "Record Coin V8.2 rigorous research results [skip ci]" || true
          git push || true

      - name: Upload V8.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: coin-v82-results-${{ github.run_id }}
          path: |
            coin-v8/results_v82/*
            coin-v8/status/latest_v82.json
            coin-v8/status/runtime_v82.log
            coin-v8/status/v82_runner_sha256.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce success
        run: test "$(cat coin-v8/status/exit_code_v82.txt)" = "0"
