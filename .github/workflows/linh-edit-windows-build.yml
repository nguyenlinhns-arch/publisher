name: Linh Edit Windows Build

on:
  push:
    branches:
      - linh-local-editor-v2
    paths:
      - "linh_edit/**"
      - "linh_edit_launcher.py"
      - "scripts/build_linh_edit_windows.ps1"
      - ".github/workflows/linh-edit-windows-build.yml"
  workflow_dispatch:

concurrency:
  group: linh-edit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned FFmpeg
        shell: powershell
        run: .\scripts\fetch_ffprobe.ps1
      - name: Build Linh Edit
        shell: powershell
        run: .\scripts\build_linh_edit_windows.ps1 -SkipFetch
      - name: Package portable build
        shell: powershell
        run: |
          if (Test-Path LinhEdit-1.1.0-Windows-x64.zip) {
            Remove-Item LinhEdit-1.1.0-Windows-x64.zip -Force
          }
          Compress-Archive -Path dist\LinhEdit\* -DestinationPath LinhEdit-1.1.0-Windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: LinhEdit-1.1.0-Windows-x64
          path: |
            dist/LinhEdit/**
            LinhEdit-1.1.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
