name: Deploy hoclaixequangninh.vn
on:
  push:
    branches: [hoclaixequangninh]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages-hoclaixe
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successful deployment
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'PAGES_DEPLOYED: hoclaixequangninh.vn';
            const body = `GitHub Pages deployed successfully.\n\nURL: ${{ steps.deployment.outputs.page_url }}\nCommit: ${context.sha}`;
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const found = issues.find(i => i.title === title);
            if (found) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body, state: 'closed'});
            } else {
              const created = await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: created.data.number, state: 'closed'});
            }
