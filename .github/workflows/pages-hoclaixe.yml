name: Deploy hoclaixequangninh.vn
on:
  push:
    branches: [hoclaixequangninh]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages-hoclaixe
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  status:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Record deployment status
        uses: actions/github-script@v7
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const title = 'PAGES_STATUS: hoclaixequangninh.vn';
            const result = process.env.DEPLOY_RESULT || 'unknown';
            const url = process.env.PAGE_URL || '';
            const body = `Result: ${result}\nURL: ${url}\nCommit: ${context.sha}\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const found = issues.find(i => i.title === title);
            if (found) {
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body, state: 'closed'});
            } else {
              const created = await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: created.data.number, state: 'closed'});
            }
