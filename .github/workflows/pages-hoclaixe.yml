name: Deploy hoclaixequangninh.vn
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: pages-hoclaixe
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: d7541c382467bb931d7a40b9650e7e2e
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate SEO, links, tracking and monetization
        run: node hlxqn-tools/validate-site-v2.mjs
      - name: Validate unique SEO metadata and sitemap indexability
        run: node hlxqn-tools/validate-seo-uniqueness.mjs
      - name: Validate current 2026 driving-test rules
        run: node hlxqn-tools/validate-current-exam-rules.mjs
      - name: Probe live lead ACK endpoint (read-only)
        run: node hlxqn-tools/probe-lead-endpoint.mjs
      - name: Build dependency-aware public artifact
        run: node hlxqn-tools/build-public-site.mjs
      - name: Harden lead ACK status context
        run: node hlxqn-tools/harden-lead-runtime.mjs
      - name: Strengthen contextual internal links
        run: node hlxqn-tools/strengthen-context-links.mjs
      - name: Finalize homepage performance and AI discovery signals
        run: node hlxqn-tools/finalize-performance.mjs
      - name: Render shared shell statically
        run: node hlxqn-tools/render-static-shell.mjs
      - name: Finalize keyboard navigation accessibility
        run: node hlxqn-tools/finalize-accessibility.mjs
      - name: Validate production performance budget
        run: node hlxqn-tools/validate-performance-budget.mjs
      - name: Validate final production artifact
        run: node hlxqn-tools/validate-public-artifact.mjs
      - name: Recheck current driving-test rules in production
        run: node hlxqn-tools/validate-current-exam-rules.mjs _site
      - name: Validate internal link graph and crawl depth
        run: node hlxqn-tools/validate-internal-link-graph.mjs
      - name: Verify public artifact
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          test -s _site/llms.txt
          test -s _site/dao-tao-lai-xe-tkv-6-thang-2026.html
          grep -q 'Cập nhật nội dung trọng tâm: 2026-08-16' _site/llms.txt
          grep -q 'dao-tao-lai-xe-tkv-6-thang-2026.html' _site/llms.txt
          grep -q 'không còn phần thi mô phỏng' _site/hoc-lai-xe-so-tu-dong-quang-ninh.html
          grep -q 'class="skip-link"' _site/index.html
          grep -q 'id="main-content"' _site/index.html
          grep -q "mode:'status',lead_id:leadId,phone:" _site/assets/site-runtime.js
          grep -q 'confirmLead(payload.lead_id,payload.phone)' _site/assets/site-runtime.js
          grep -q 'kinh-nghiem-hoc-lai-xe-lan-dau.html' _site/buoi-hoc-lai-xe-dau-tien-can-biet-gi.html
          grep -q 'loi-de-mat-diem-khi-thi-sa-hinh.html' _site/loi-thuong-gap-khi-hoc-sa-hinh.html
          grep -q 'cach-lai-xe-an-toan-khi-troi-mua.html' _site/meo-lai-xe-duong-truong-cho-nguoi-moi.html
          grep -q 'cach-lai-xe-xuong-doc-an-toan.html' _site/meo-lai-xe-duong-truong-cho-nguoi-moi.html
          grep -q 'cach-lai-xe-so-tu-dong-cho-nguoi-moi.html' _site/hoc-lai-xe-so-tu-dong-quang-ninh.html
          grep -q 'meo-hoc-thuc-hanh-lai-xe-b.html' _site/hoc-thuc-hanh-sa-hinh.html
          test -s _site/assets/site-runtime.js
          test ! -e _site/assets/official-shell.js
          ! grep -q 'official-shell.js' _site/assets/site-config.js
          ! grep -Eq '@import[^;]+official-(site|pages)\.css' _site/assets/mobile-v2.css
          grep -q '<title>Học Lái Xe Quảng Ninh | B tự động, B cơ khí, C1, A1</title>' _site/index.html
          grep -q 'rel="preload" as="image" href="/assets/quang-hanh-san-sat-hach.jpg"' _site/index.html
          grep -q 'Học lái xe Quảng Ninh: <em>chọn đúng khóa học</em>' _site/index.html
          grep -q '<a class="primary" href="#dang-ky">Đăng ký tư vấn</a>' _site/index.html
          grep -q 'Tư vấn miễn phí' _site/index.html
          grep -q 'Nếu B tự động và B cơ khí cùng mức 20,9 triệu' _site/hoc-phi-hoc-lai-xe-quang-ninh.html
          grep -q 'class="official-header"' _site/hoc-lai-xe-so-tu-dong-quang-ninh.html
          grep -q 'class="official-footer"' _site/hoc-lai-xe-so-tu-dong-quang-ninh.html
          test ! -e _site/coin-v7
          test ! -e _site/coin-v8
          test ! -e _site/coin-v9
          test ! -e _site/src
          test ! -e _site/tests
          test ! -e _site/requirements.txt
          test ! -e _site/requirements-dev.txt
          test ! -e _site/assets/nen.png
          test ! -e _site/assets/sound.mp3
      - name: Publish stable IndexNow ownership key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INDEXNOW_KEY"
          printf '%s' "$INDEXNOW_KEY" > "_site/${INDEXNOW_KEY}.txt"
          test "$(cat "_site/${INDEXNOW_KEY}.txt")" = "$INDEXNOW_KEY"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live HTTPS production responses
        run: node hlxqn-tools/smoke-live-site.mjs
      - name: Measure live homepage with Lighthouse 13.4.1
        continue-on-error: true
        shell: bash
        run: |
          set +e
          google-chrome --version || google-chrome-stable --version || true
          npx --yes lighthouse@13.4.1 https://hoclaixequangninh.vn/ \
            --quiet \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=/tmp/hoclaixe-lighthouse.json
          rc=$?
          if [ -s /tmp/hoclaixe-lighthouse.json ]; then
            node hlxqn-tools/summarize-lighthouse.mjs /tmp/hoclaixe-lighthouse.json
          else
            echo "Lighthouse report unavailable (exit=$rc); live smoke remains the deployment health gate."
          fi
          exit 0
      - name: Verify stable IndexNow key is live
        shell: bash
        run: |
          set -euo pipefail
          url="https://hoclaixequangninh.vn/${INDEXNOW_KEY}.txt?_verify=$(date +%s)"
          value="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$url")"
          test "$value" = "$INDEXNOW_KEY"
      - name: Notify IndexNow about changed URLs
        run: node hlxqn-tools/submit-indexnow.mjs
  status:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const title='PAGES_STATUS: hoclaixequangninh.vn';
            const body=`Result: ${process.env.RESULT}\nURL: ${process.env.PAGE_URL||''}\nCommit: ${context.sha}\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data:items}=await github.rest.issues.listForRepo({owner:context.repo.owner,repo:context.repo.repo,state:'all',per_page:100});
            const found=items.find(x=>x.title===title);
            if(found) await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:found.number,body,state:'closed'});
            else {const r=await github.rest.issues.create({owner:context.repo.owner,repo:context.repo.repo,title,body});await github.rest.issues.update({owner:context.repo.owner,repo:context.repo.repo,issue_number:r.data.number,state:'closed'});}
