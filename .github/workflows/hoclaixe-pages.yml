name: Publish hoclaixequangninh.vn
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
concurrency:
  group: hoclaixe-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v6
        with:
          ref: hoclaixequangninh
      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  status:
    if: always()
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Record Pages status
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        with:
          script: |
            const title = 'PAGES_STATUS: hoclaixequangninh.vn';
            const body = `Result: ${process.env.RESULT}\nURL: ${process.env.PAGE_URL || ''}\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const {data: items} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'all', per_page: 100});
            const found = items.find(x => x.title === title);
            if (found) await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: found.number, body, state: 'closed'});
            else { const r = await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body}); await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: r.data.number, state: 'closed'}); }
