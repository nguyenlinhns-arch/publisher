name: Coin V9 Positive Candidate Follow-up

on:
  push:
    paths:
      - "coin-v9/followup_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-v9-positive-followup
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow numpy requests numba scipy
      - name: Run positive-candidate holdout evaluation
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          rm -rf coin-v9/results_followup
          mkdir -p coin-v9/results_followup coin-v9/status
          set +e
          python coin-v9/followup/evaluate_positive_pre_candidates.py 2>&1 | tee coin-v9/status/runtime_followup.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > coin-v9/status/exit_code_followup.txt
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          rc=int(open('coin-v9/status/exit_code_followup.txt').read().strip())
          payload={
            'state':'COMPLETED' if rc==0 else 'FAILED',
            'run_id':os.environ['GITHUB_RUN_ID'],
            'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'trigger_sha':os.environ['GITHUB_SHA'],
            'exit_code':rc,
            'finished_at_utc':datetime.now(timezone.utc).isoformat(),
            'mode':'RESEARCH_ONLY / NO_PAPER / NO_LIVE',
          }
          open('coin-v9/status/latest_followup.json','w',encoding='utf-8').write(json.dumps(payload,indent=2))
          PY
          exit 0
      - name: Commit compact results and status
        run: |
          git pull --rebase || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v9/results_followup/positive_candidates_holdout.csv coin-v9/results_followup/preselected_ensembles_holdout.csv coin-v9/results_followup/followup_summary.json coin-v9/results_followup/REPORT_FOLLOWUP_V9_VI.md coin-v9/results_followup/data_audit_followup.csv coin-v9/status/latest_followup.json coin-v9/status/runtime_followup.log || true
          git commit -m "Record Coin V9 positive-candidate follow-up [skip ci]" || true
          git push || true
      - name: Upload full follow-up artifact
        uses: actions/upload-artifact@v4
        with:
          name: coin-v9-positive-followup-${{ github.run_id }}
          path: |
            coin-v9/results_followup/**
            coin-v9/status/latest_followup.json
            coin-v9/status/runtime_followup.log
          retention-days: 30
          compression-level: 6
          if-no-files-found: warn
      - name: Enforce success
        run: test "$(cat coin-v9/status/exit_code_followup.txt)" = "0"
