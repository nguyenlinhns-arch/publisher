name: Zalo Linh release publisher tests

on:
  push:
    paths:
      - 'scripts/zalo_linh_release*.py'
      - 'tests/test_zalo_release.py'
      - 'zalo-linh/channels/**'
      - '.github/workflows/zalo-linh-release*.yml'
  pull_request:
    paths:
      - 'scripts/zalo_linh_release*.py'
      - 'tests/test_zalo_release.py'
      - 'zalo-linh/channels/**'
      - '.github/workflows/zalo-linh-release*.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install --disable-pip-version-check 'cryptography>=44,<50' 'pytest>=8,<10'
      - name: Verify release publisher & rollback gates
        run: python -m pytest -q tests/test_zalo_release.py
      - name: Verify existing stable manifest signature
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from zalo_linh_release import assert_valid_feed
          with open('zalo-linh/stable.json', encoding='utf-8') as fh:
              feed = json.load(fh)
          assert_valid_feed(feed)
          print('Production feed signature VALID; signed version:', feed['version'])
          PY
