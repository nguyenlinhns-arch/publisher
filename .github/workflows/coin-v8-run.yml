name: Coin V8 Robust Iterative Research Run

on:
  push:
    paths:
      - "coin-v8/run_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-v8-robust-run
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow numpy requests numba scipy

      - name: Reconstruct and verify runner
        run: |
          mkdir -p coin-v8/status coin-v8/results
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, sys
          expected = "ec5b1979369135917866bb732eaca0f856b964545691db9952026d84f5c45273"
          parts = [
              "coin-v8/source/iterative_research.b64.part00",
              "coin-v8/source/iterative_research.b64.part01",
              "coin-v8/source/fixed/p02_0",
              "coin-v8/source/fixed/p02_1",
              "coin-v8/source/fixed/p02_2",
              "coin-v8/source/fixed/p03_0",
              "coin-v8/source/fixed/p03_1",
              "coin-v8/source/fixed/p03_2",
              "coin-v8/source/fixed/p04_0",
              "coin-v8/source/fixed/p04_1",
              "coin-v8/source/fixed/p04_2_0",
              "coin-v8/source/fixed/p04_2_1",
              "coin-v8/source/fixed/p04_2_2",
              "coin-v8/source/fixed/p04_2_3",
              "coin-v8/source/iterative_research.b64.part05",
              "coin-v8/source/iterative_research.b64.part06",
          ]
          encoded = b"".join(pathlib.Path(p).read_bytes() for p in parts)
          decoded = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(decoded).hexdigest()
          print({"encoded_bytes": len(encoded), "decoded_bytes": len(decoded), "source_sha256": actual})
          if actual != expected:
              raise SystemExit(f"SHA mismatch: {actual}")
          target = pathlib.Path("coin-v8/iterative_research.py")
          target.write_bytes(decoded)
          source = target.read_text(encoding="utf-8")
          old = "cfg['lookback']"
          occurrences = source.count(old)
          if occurrences != 5:
              raise SystemExit(f"Unexpected lookback patch count: {occurrences}")
          source = source.replace(old, "int(cfg['lookback'])")
          target.write_text(source, encoding="utf-8")
          patched_sha = hashlib.sha256(target.read_bytes()).hexdigest()
          print({"deterministic_runtime_patch": "cast finalist lookback to int", "occurrences": occurrences, "patched_sha256": patched_sha})
          subprocess.run([sys.executable, "-m", "py_compile", str(target)], check=True)
          PY

      - name: Execute iterative research and capture full log
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          python coin-v8/iterative_research.py 2>&1 | tee coin-v8/status/runtime.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > coin-v8/status/exit_code.txt
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          rc = int(open("coin-v8/status/exit_code.txt").read().strip())
          payload = {
              "state": "COMPLETED" if rc == 0 else "FAILED",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "exit_code": rc,
              "finished_at_utc": datetime.now(timezone.utc).isoformat(),
              "mode": "RESEARCH_ONLY / NO_PAPER / NO_LIVE",
          }
          open("coin-v8/status/latest_robust.json", "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          exit 0

      - name: Commit logs and compact results
        run: |
          git pull --rebase || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status coin-v8/results
          git commit -m "Record Coin V8 robust research run [skip ci]" || true
          git push || true

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: coin-v8-robust-results-${{ github.run_id }}
          path: |
            coin-v8/results/*
            coin-v8/status/runtime.log
            coin-v8/status/latest_robust.json
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce research exit code
        run: |
          test "$(cat coin-v8/status/exit_code.txt)" = "0"
