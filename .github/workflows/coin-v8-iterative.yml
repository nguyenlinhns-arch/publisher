name: Coin V8 Iterative Indicator Research

on:
  push:
    paths:
      - "coin-v8/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-v8-iterative-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record auditable running status
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p coin-v8/status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "state": "RUNNING",
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "trigger_sha": os.environ["HEAD_SHA"],
              "started_at_utc": datetime.now(timezone.utc).isoformat(),
              "mode": "RESEARCH_ONLY / NO_PAPER / NO_LIVE",
          }
          open("coin-v8/status/latest.json", "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status/latest.json
          git commit -m "Mark Coin V8 research run ${RUN_ID} running [skip ci]" || true
          git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow numpy requests numba scipy

      - name: Reconstruct and verify iterative runner
        run: |
          mkdir -p coin-v8/status
          python - <<'PY'
          import base64, glob, hashlib, json, pathlib, subprocess, sys
          expected = "ec5b1979369135917866bb732eaca0f856b964545691db9952026d84f5c45273"
          parts = sorted(glob.glob("coin-v8/source/iterative_research.b64.part*"))
          encoded = b"".join(pathlib.Path(p).read_bytes() for p in parts)
          diag = {"parts": parts, "part_count": len(parts), "encoded_bytes": len(encoded), "expected_sha256": expected}
          rc = 1
          try:
              decoded = base64.b64decode(encoded, validate=True)
              actual = hashlib.sha256(decoded).hexdigest()
              diag.update({"decoded_bytes": len(decoded), "actual_sha256": actual, "decode_ok": True})
              pathlib.Path("coin-v8/iterative_research.py").write_bytes(decoded)
              compile_run = subprocess.run([sys.executable, "-m", "py_compile", "coin-v8/iterative_research.py"], text=True, capture_output=True)
              diag.update({"compile_returncode": compile_run.returncode, "compile_stdout": compile_run.stdout, "compile_stderr": compile_run.stderr})
              rc = 0 if actual == expected and compile_run.returncode == 0 else 1
          except Exception as exc:
              diag.update({"decode_ok": False, "exception": repr(exc)})
          pathlib.Path("coin-v8/status/reconstruction.json").write_text(json.dumps(diag, indent=2), encoding="utf-8")
          print(json.dumps(diag, indent=2))
          raise SystemExit(rc)
          PY

      - name: Run iterative indicator research
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: python coin-v8/iterative_research.py

      - name: Upload full research results
        uses: actions/upload-artifact@v4
        with:
          name: coin-v8-iterative-results-${{ github.run_id }}
          path: coin-v8/results/*
          retention-days: 30
          compression-level: 6
          if-no-files-found: error

      - name: Commit compact results and success status
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p = "coin-v8/status/latest.json"
          try:
              payload = json.load(open(p, encoding="utf-8"))
          except Exception:
              payload = {}
          payload.update({"state": "COMPLETED", "run_id": os.environ["RUN_ID"], "run_attempt": os.environ["RUN_ATTEMPT"], "completed_at_utc": datetime.now(timezone.utc).isoformat()})
          open(p, "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          git add coin-v8/results coin-v8/status
          git commit -m "Update Coin V8 iterative research results [skip ci]" || true
          git push

      - name: Record failure status
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git pull --rebase || true
          mkdir -p coin-v8/status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p = "coin-v8/status/latest.json"
          try:
              payload = json.load(open(p, encoding="utf-8"))
          except Exception:
              payload = {}
          payload.update({"state": "FAILED", "run_id": os.environ["RUN_ID"], "run_attempt": os.environ["RUN_ATTEMPT"], "failed_at_utc": datetime.now(timezone.utc).isoformat()})
          open(p, "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status
          git commit -m "Mark Coin V8 research run ${RUN_ID} failed [skip ci]" || true
          git push || true
