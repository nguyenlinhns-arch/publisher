name: Coin V8 Source Chunk Diagnostic

on:
  push:
    paths:
      - "coin-v8/diagnose_trigger.txt"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute chunk sizes and hashes
        run: |
          mkdir -p coin-v8/status
          python - <<'PY'
          import glob, hashlib, json, pathlib
          rows=[]
          for p in sorted(glob.glob('coin-v8/source/iterative_research.b64.part*')):
              b=pathlib.Path(p).read_bytes()
              rows.append({'file':p,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          pathlib.Path('coin-v8/status/chunks.json').write_text(json.dumps({'total_bytes':sum(r['bytes'] for r in rows),'parts':rows},indent=2),encoding='utf-8')
          print(json.dumps(rows,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status/chunks.json
          git commit -m "Record Coin V8 source chunk integrity [skip ci]" || true
          git push
