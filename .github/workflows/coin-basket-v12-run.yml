name: Coin Basket V12 Backtest Runner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/coin-basket-v12-run.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/coin-basket-v12
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests matplotlib openpyxl

      - name: Decode and validate engine
        run: |
          base64 -d coin_research/v12/backtest.py.gz.b64 | gzip -d > coin_research/v12/backtest.py
          python -m py_compile coin_research/v12/backtest.py

      - name: Run development tournament and locked test
        run: |
          rm -rf coin_research/v12/results
          python coin_research/v12/backtest.py --output coin_research/v12/results

      - name: Remove raw market cache
        run: rm -rf coin_research/v12/results/cache

      - name: Upload result package
        uses: actions/upload-artifact@v4
        with:
          name: COIN_V12_MULTI_ASSET_RESULTS
          path: |
            coin_research/v12/results/COIN_V12_MULTI_ASSET_BACKTEST.xlsx
            coin_research/v12/results/COIN_V12_MULTI_ASSET_PACKAGE.zip
            coin_research/v12/results/REPORT.md
            coin_research/v12/results/summary.json
            coin_research/v12/results/equity.png
            coin_research/v12/results/development_leaderboard.csv
            coin_research/v12/results/test_trades.csv
            coin_research/v12/results/current_signals.csv
          retention-days: 90

      - name: Commit results to isolated research branch
        run: |
          git config user.name 'coin-research-bot'
          git config user.email 'coin-research-bot@users.noreply.github.com'
          git add coin_research/v12/results coin_research/v12/backtest.py
          git commit -m 'Add Coin V12 multi-asset backtest results [skip ci]' || exit 0
          git push origin HEAD:research/coin-basket-v12
