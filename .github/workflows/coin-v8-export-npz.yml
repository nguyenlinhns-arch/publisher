name: Coin BTC ETH NumPy Warehouse Export

on:
  push:
    paths:
      - "coin-v8/export_npz_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-v8-export-npz
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyarrow numpy requests

      - name: Record export start
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p coin-v8/status coin-v8/npz
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p={'state':'RUNNING','run_id':os.environ['RUN_ID'],'trigger_sha':os.environ['HEAD_SHA'],'started_at_utc':datetime.now(timezone.utc).isoformat()}
          open('coin-v8/status/npz_export.json','w',encoding='utf-8').write(json.dumps(p,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status/npz_export.json
          git commit -m "Mark Coin NumPy export running [skip ci]" || true
          git push || true

      - name: Download and convert Parquet to compressed NumPy
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, requests
          from datetime import datetime, timezone
          import numpy as np
          import pandas as pd

          root='https://huggingface.co/datasets/linxy/USDT-M_Perpetual_Futures/resolve/main'
          out=pathlib.Path('coin-v8/npz'); out.mkdir(parents=True,exist_ok=True)
          manifest={'generated_at_utc':datetime.now(timezone.utc).isoformat(),'files':[]}
          for sym in ['BTCUSDT','ETHUSDT']:
              bundle={}
              for kind,name in [('kline',f'{sym}_5m.parquet'),('metrics',f'{sym}_metrics.parquet'),('funding',f'{sym}_fundingRate.parquet')]:
                  url=f'{root}/{sym}/{name}?download=true'
                  p=out/name
                  with requests.get(url,stream=True,timeout=300) as r:
                      r.raise_for_status()
                      with p.open('wb') as f:
                          for chunk in r.iter_content(1024*1024):
                              if chunk: f.write(chunk)
                  df=pd.read_parquet(p)
                  cols=list(df.columns)
                  data={}
                  for c in cols:
                      s=df[c]
                      if pd.api.types.is_datetime64_any_dtype(s):
                          data[c]=pd.to_datetime(s,utc=True).astype('int64').to_numpy()
                      elif pd.api.types.is_numeric_dtype(s):
                          # Keep timestamps/counters exact where useful; use float64 for prices and ratios.
                          if 'time' in c.lower() and pd.api.types.is_integer_dtype(s):
                              data[c]=s.to_numpy(dtype=np.int64,copy=False)
                          elif pd.api.types.is_integer_dtype(s) and c.lower() in {'count'}:
                              data[c]=s.to_numpy(dtype=np.int32,copy=False)
                          else:
                              data[c]=pd.to_numeric(s,errors='coerce').to_numpy(dtype=np.float64)
                      else:
                          data[c]=s.astype(str).to_numpy(dtype='U32')
                  npz=out/f'{sym}_{kind}.npz'
                  np.savez_compressed(npz,**data)
                  manifest['files'].append({'symbol':sym,'kind':kind,'source':name,'rows':len(df),'columns':cols,'npz':npz.name,'bytes':npz.stat().st_size,'sha256':hashlib.sha256(npz.read_bytes()).hexdigest()})
                  p.unlink()
              # package each symbol separately for artifact size and easy transfer
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Upload BTC NumPy warehouse
        uses: actions/upload-artifact@v4
        with:
          name: coin-btc-npz-${{ github.run_id }}
          path: |
            coin-v8/npz/BTCUSDT_*.npz
            coin-v8/npz/manifest.json
          retention-days: 30
          compression-level: 0
      - name: Upload ETH NumPy warehouse
        uses: actions/upload-artifact@v4
        with:
          name: coin-eth-npz-${{ github.run_id }}
          path: |
            coin-v8/npz/ETHUSDT_*.npz
            coin-v8/npz/manifest.json
          retention-days: 30
          compression-level: 0

      - name: Commit manifest and completion status
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git pull --rebase || true
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          m=json.load(open('coin-v8/npz/manifest.json',encoding='utf-8'))
          p={'state':'COMPLETED','run_id':os.environ['RUN_ID'],'trigger_sha':os.environ['HEAD_SHA'],'completed_at_utc':datetime.now(timezone.utc).isoformat(),'artifacts':[f"coin-btc-npz-{os.environ['RUN_ID']}",f"coin-eth-npz-{os.environ['RUN_ID']}"],'manifest':m}
          open('coin-v8/status/npz_export.json','w',encoding='utf-8').write(json.dumps(p,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status/npz_export.json coin-v8/npz/manifest.json
          git commit -m "Complete Coin NumPy market warehouse export [skip ci]" || true
          git push || true
