name: COIN Basket V12 Backtest

on:
  pull_request:
    paths:
      - 'research/coin-basket-v12/**'
      - '.github/workflows/coin-basket-v12-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow requests scipy openpyxl xlsxwriter matplotlib nbformat nbclient ipykernel
      - name: Execute basket backtest
        run: python research/coin-basket-v12/backtest.py
      - name: Upload reproducibility package
        uses: actions/upload-artifact@v4
        with:
          name: coin-basket-v12-results
          path: research/coin-basket-v12/output/**
          if-no-files-found: error
          retention-days: 7
