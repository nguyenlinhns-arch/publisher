name: Coin V9 Follow-up Status Probe

on:
  push:
    paths:
      - "coin-v9/followup_probe_trigger.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe follow-up workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p coin-v9/status
          gh run list --workflow "Coin V9 Positive Candidate Follow-up" --limit 5 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url,displayTitle > coin-v9/status/followup_workflow_runs.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          rows=json.load(open('coin-v9/status/followup_workflow_runs.json',encoding='utf-8'))
          out={'probed_at_utc':datetime.now(timezone.utc).isoformat(),'latest':rows[0] if rows else None,'runs':rows}
          open('coin-v9/status/followup_probe_latest.json','w',encoding='utf-8').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Commit probe
        run: |
          git pull --rebase || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v9/status/followup_workflow_runs.json coin-v9/status/followup_probe_latest.json
          git commit -m "Update Coin V9 follow-up workflow probe [skip ci]" || true
          git push || true
