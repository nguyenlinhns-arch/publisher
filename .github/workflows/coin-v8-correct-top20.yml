name: Coin V8 Corrected Active Period Audit

on:
  push:
    paths:
      - "coin-v8/correct_top20_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-v8-correct-top20
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas pyarrow numpy
      - name: Recompute true active-period metrics by segment and cost
        run: |
          python - <<'PY'
          import glob, json, os
          from datetime import datetime, timezone
          import numpy as np
          import pandas as pd

          HOLDOUT=pd.Timestamp('2025-07-20T00:00:00Z')
          BASE_EXTRA_STRESS=0.0012
          rows=[]; schemas={}

          def evaluate(cid, segment, cost_case, x):
              if cost_case=='stress':
                  x=x.copy(); x['ret']=x['ret']-BASE_EXTRA_STRESS
              if len(x)==0:
                  return {'config_id':cid,'segment':segment,'cost_case':cost_case,'trades':0}
              def agg(freq):
                  g=x.set_index('time')['ret'].groupby(pd.Grouper(freq=freq))
                  counts=g.size()
                  comp=g.apply(lambda z: float(np.prod(1+z.to_numpy(float))-1))
                  return comp[counts>0].dropna()
              d=agg('1D'); w=agg('W-SUN'); m=agg('ME')
              r=x.ret.to_numpy(float)
              eq=np.cumprod(1+np.clip(r,-0.999,None)); peak=np.maximum.accumulate(eq)
              gains=r[r>0].sum(); losses=-r[r<0].sum()
              pf=float(gains/losses) if losses>0 else (float('inf') if gains>0 else np.nan)
              span=int((x.time.max().floor('D')-x.time.min().floor('D')).days+1)
              return {
                  'config_id':cid,'segment':segment,'cost_case':cost_case,'trades':len(x),
                  'trade_win_rate':float((r>0).mean()),'profit_factor':pf,'mean_return':float(r.mean()),
                  'total_return':float(np.prod(1+r)-1),'max_drawdown':float(np.min(eq/peak-1)),
                  'active_days':len(d),'positive_active_day_rate':float((d>0).mean()),
                  'calendar_days_covered':span,'positive_calendar_day_rate':float((d>0).sum()/span),
                  'active_weeks':len(w),'positive_active_week_rate':float((w>0).mean()),
                  'active_months':len(m),'positive_active_month_rate':float((m>0).mean()),
                  'first_exit':x.time.min().isoformat(),'last_exit':x.time.max().isoformat(),
              }

          for path in sorted(glob.glob('coin-v8/results/trades_*.parquet')):
              df=pd.read_parquet(path)
              cid=os.path.basename(path).replace('trades_','').replace('.parquet','')
              schemas[cid]=list(df.columns)
              lower={str(c).lower():c for c in df.columns}
              tcol=next((lower[x] for x in ['exit_time','exit_timestamp','exit_dt','exit_datetime'] if x in lower),None)
              rcol=next((lower[x] for x in ['net_return','return','ret','net_ret','pnl_return'] if x in lower),None)
              if tcol is None:
                  tcol=next((c for c in df.columns if 'exit' in str(c).lower() and ('time' in str(c).lower() or 'date' in str(c).lower())),None)
              if rcol is None:
                  rcol=next((c for c in df.columns if 'return' in str(c).lower() or str(c).lower() in {'ret','pnl'}),None)
              if tcol is None or rcol is None:
                  rows.append({'config_id':cid,'segment':'error','cost_case':'base','error':f'columns={list(df.columns)}'})
                  continue
              x=pd.DataFrame({'time':pd.to_datetime(df[tcol],utc=True,errors='coerce'),'ret':pd.to_numeric(df[rcol],errors='coerce')}).dropna().sort_values('time')
              segments={'full':x,'pre':x[x.time<HOLDOUT],'oos':x[x.time>=HOLDOUT]}
              for segment,y in segments.items():
                  rows.append(evaluate(cid,segment,'base',y))
                  if segment=='oos': rows.append(evaluate(cid,segment,'stress',y))

          out=pd.DataFrame(rows)
          out.to_csv('coin-v8/results/corrected_top20_segment_metrics.csv',index=False)
          payload={
              'generated_at_utc':datetime.now(timezone.utc).isoformat(),
              'holdout_start':HOLDOUT.isoformat(),
              'stress_extra_round_trip_cost':BASE_EXTRA_STRESS,
              'definition':'Active day/week/month rates exclude periods containing zero trades.',
              'rows':rows,'schemas':schemas,
          }
          open('coin-v8/results/corrected_top20_segment_metrics.json','w',encoding='utf-8').write(json.dumps(payload,indent=2,default=str))
          print(out[(out.segment=='oos')&(out.cost_case=='base')].sort_values(['positive_active_day_rate','trade_win_rate','total_return'],ascending=False).to_string(index=False))
          PY
      - name: Commit audit
        run: |
          git pull --rebase || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/results/corrected_top20_segment_metrics.*
          git commit -m "Add corrected Coin V8 holdout active-period audit [skip ci]" || true
          git push || true
