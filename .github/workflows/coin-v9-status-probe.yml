name: Coin V9 Status Probe

on:
  push:
    paths:
      - "coin-v9/status_probe_trigger.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read latest V9 workflow status and failed log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p coin-v9/status
          gh run list \
            --workflow "Coin V9 Daily Leverage Research" \
            --limit 5 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,url,displayTitle \
            > coin-v9/status/workflow_runs.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          p='coin-v9/status/workflow_runs.json'
          rows=json.load(open(p,encoding='utf-8'))
          out={'probed_at_utc':datetime.now(timezone.utc).isoformat(),'latest':rows[0] if rows else None,'runs':rows}
          open('coin-v9/status/probe_latest.json','w',encoding='utf-8').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
          latest_id=$(python - <<'PY'
          import json
          rows=json.load(open('coin-v9/status/workflow_runs.json',encoding='utf-8'))
          print(rows[0]['databaseId'] if rows else '')
          PY
          )
          if [ -n "$latest_id" ]; then
            gh run view "$latest_id" --log-failed > coin-v9/status/latest_failed.log 2>&1 || true
          fi
      - name: Commit probe
        run: |
          git pull --rebase || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v9/status/workflow_runs.json coin-v9/status/probe_latest.json coin-v9/status/latest_failed.log || true
          git commit -m "Update Coin V9 workflow status probe [skip ci]" || true
          git push || true
