name: Coin V8.1 Iterative Indicator Research Corrected

on:
  push:
    paths:
      - "coin-v8/fixed_run_trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coin-v8-iterative-fixed
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow numpy requests numba scipy

      - name: Reconstruct, verify and patch runner
        run: |
          rm -rf coin-v8/results
          mkdir -p coin-v8/status coin-v8/results
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, sys

          expected = "ec5b1979369135917866bb732eaca0f856b964545691db9952026d84f5c45273"
          parts = [
              "coin-v8/source/iterative_research.b64.part00",
              "coin-v8/source/iterative_research.b64.part01",
              "coin-v8/source/fixed/p02_0",
              "coin-v8/source/fixed/p02_1",
              "coin-v8/source/fixed/p02_2",
              "coin-v8/source/fixed/p03_0",
              "coin-v8/source/fixed/p03_1",
              "coin-v8/source/fixed/p03_2",
              "coin-v8/source/fixed/p04_0",
              "coin-v8/source/fixed/p04_1",
              "coin-v8/source/fixed/p04_2_0",
              "coin-v8/source/fixed/p04_2_1",
              "coin-v8/source/fixed/p04_2_2",
              "coin-v8/source/fixed/p04_2_3",
              "coin-v8/source/iterative_research.b64.part05",
              "coin-v8/source/iterative_research.b64.part06",
          ]
          encoded = b"".join(pathlib.Path(p).read_bytes() for p in parts)
          decoded = base64.b64decode(encoded, validate=True)
          actual = hashlib.sha256(decoded).hexdigest()
          if actual != expected:
              raise SystemExit(f"Original runner SHA mismatch: {actual}")

          target = pathlib.Path("coin-v8/iterative_research.py")
          text = decoded.decode("utf-8")

          # Pandas may promote integer-valued configuration fields to floats
          # during finalist selection. Normalize before feature lookup.
          anchor = 'def make_signal(x: pd.DataFrame, cfg: dict[str, Any]) -> np.ndarray:\n    side = int(cfg["side"])\n'
          replacement = 'def make_signal(x: pd.DataFrame, cfg: dict[str, Any]) -> np.ndarray:\n    if "lookback" in cfg:\n        cfg["lookback"] = int(round(float(cfg["lookback"])))\n    side = int(cfg["side"])\n'
          if anchor not in text:
              raise SystemExit("make_signal patch anchor not found")
          text = text.replace(anchor, replacement, 1)

          anchor2 = '        out[k] = v\n    return out\n\n\ndef ensemble_search'
          replacement2 = '        if k in {"lookback", "max_hold", "side"}:\n            v = int(round(float(v)))\n        elif isinstance(v, np.generic):\n            v = v.item()\n        out[k] = v\n    return out\n\n\ndef ensemble_search'
          if anchor2 not in text:
              raise SystemExit("config_from_row patch anchor not found")
          text = text.replace(anchor2, replacement2, 1)

          # Correct active-day/week/month metrics. The original Grouper.apply
          # emitted zero-valued empty periods between trades, which mislabeled
          # calendar coverage as active periods and distorted the search score.
          start = text.index("def aggregate_period(")
          end = text.index("\n\ndef metrics_from_trades", start)
          active_period_func = '''def aggregate_period(exit_times: pd.DatetimeIndex, returns: np.ndarray, freq: str) -> pd.Series:
    if len(returns) == 0:
        return pd.Series(dtype=float)
    s = pd.Series(np.asarray(returns, float), index=pd.DatetimeIndex(exit_times))
    grouped = s.groupby(pd.Grouper(freq=freq))
    compounded = grouped.apply(lambda x: float(np.prod(1.0 + x.to_numpy()) - 1.0))
    counts = grouped.size()
    return compounded[counts > 0].dropna()
'''
          text = text[:start] + active_period_func + text[end:]

          target.write_text(text, encoding="utf-8")
          subprocess.run([sys.executable, "-m", "py_compile", str(target)], check=True)
          patched_sha = hashlib.sha256(target.read_bytes()).hexdigest()
          pathlib.Path("coin-v8/status/patched_runner_v81_sha256.txt").write_text(patched_sha + "\n", encoding="utf-8")
          print({"original_sha256": actual, "patched_sha256": patched_sha, "parts": len(parts), "active_period_fix": True})
          PY

      - name: Execute corrected iterative research and capture log
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          python coin-v8/iterative_research.py 2>&1 | tee coin-v8/status/runtime_v81.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > coin-v8/status/exit_code_v81.txt
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          rc = int(open("coin-v8/status/exit_code_v81.txt").read().strip())
          payload = {
              "state": "COMPLETED" if rc == 0 else "FAILED",
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "trigger_sha": os.environ["GITHUB_SHA"],
              "exit_code": rc,
              "finished_at_utc": datetime.now(timezone.utc).isoformat(),
              "metric_definition": "positive active day/week/month rate excludes zero-trade periods",
              "mode": "RESEARCH_ONLY / NO_PAPER / NO_LIVE",
          }
          open("coin-v8/status/latest_v81.json", "w", encoding="utf-8").write(json.dumps(payload, indent=2))
          PY
          exit 0

      - name: Commit logs and compact results
        run: |
          git pull --rebase || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A coin-v8/status coin-v8/results
          git commit -m "Record corrected Coin V8.1 iterative research run [skip ci]" || true
          git push || true

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: coin-v8-v81-results-${{ github.run_id }}
          path: |
            coin-v8/results/*
            coin-v8/status/runtime_v81.log
            coin-v8/status/latest_v81.json
            coin-v8/status/patched_runner_v81_sha256.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Enforce research exit code
        run: |
          test "$(cat coin-v8/status/exit_code_v81.txt)" = "0"
