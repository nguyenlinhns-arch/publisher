name: Coin V8.2 Trigger Heartbeat

on:
  push:
    paths:
      - "coin-v8/v82_trigger.txt"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record heartbeat
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p coin-v8/status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p={'state':'TRIGGERED','run_id':os.environ['RUN_ID'],'trigger_sha':os.environ['HEAD_SHA'],'time_utc':datetime.now(timezone.utc).isoformat()}
          open('coin-v8/status/v82_heartbeat.json','w',encoding='utf-8').write(json.dumps(p,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status/v82_heartbeat.json
          git commit -m "Record Coin V8.2 trigger heartbeat [skip ci]" || true
          git push || true
