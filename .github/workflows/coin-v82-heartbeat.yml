name: Coin V8.2 Trigger Heartbeat

on:
  push:
    paths:
      - "coin-v8/v82_trigger.txt"

permissions:
  contents: write
  actions: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record heartbeat and related workflow runs
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p coin-v8/status
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p={'state':'TRIGGERED','run_id':os.environ['RUN_ID'],'trigger_sha':os.environ['HEAD_SHA'],'time_utc':datetime.now(timezone.utc).isoformat()}
          open('coin-v8/status/v82_heartbeat.json','w',encoding='utf-8').write(json.dumps(p,indent=2))
          PY
          sleep 15
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            > coin-v8/status/v82_runs_raw.json
          python - <<'PY'
          import json
          raw=json.load(open('coin-v8/status/v82_runs_raw.json',encoding='utf-8'))
          rows=[]
          for r in raw.get('workflow_runs',[]):
              rows.append({k:r.get(k) for k in ['id','name','event','status','conclusion','workflow_id','head_sha','run_number','run_attempt','created_at','updated_at','html_url']})
          open('coin-v8/status/v82_runs.json','w',encoding='utf-8').write(json.dumps({'total_count':raw.get('total_count'),'runs':rows},indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coin-v8/status/v82_heartbeat.json coin-v8/status/v82_runs.json
          git commit -m "Record Coin V8.2 trigger and workflow runs [skip ci]" || true
          git push || true
